name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Add notification permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n</manifest>#' "$M"
      - name: Create notification sound
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import wave, math, struct
          sr = 22050
          def bell(f, dur, amp):
              out = []
              for i in range(int(sr * dur)):
                  t = i / sr
                  env = math.exp(-3.0 * t) * min(1.0, t * 200)
                  v = (math.sin(2 * math.pi * f * t)
                       + 0.4 * math.sin(2 * math.pi * f * 2.01 * t) * math.exp(-2 * t)
                       + 0.2 * math.sin(2 * math.pi * f * 3 * t) * math.exp(-4 * t))
                  out.append(amp * env * v)
              return out
          total = [0.0] * int(sr * 2.8)
          for i, v in enumerate(bell(659.25, 1.6, 0.35)):
              total[i] += v
          off = int(sr * 0.45)
          for i, v in enumerate(bell(880.0, 2.0, 0.35)):
              if off + i < len(total):
                  total[off + i] += v
          w = wave.open("android/app/src/main/res/raw/chime.wav", "wb")
          w.setnchannels(1)
          w.setsampwidth(2)
          w.setframerate(sr)
          w.writeframes(b"".join(struct.pack("<h", int(max(-1.0, min(1.0, x)) * 32000)) for x in total))
          w.close()
          PY
          ls -l android/app/src/main/res/raw
      - run: npx cap sync android
      - name: Download Gradle
        run: |
          for u in \
            https://services.gradle.org/distributions/gradle-8.2.1-bin.zip \
            https://downloads.gradle.org/distributions/gradle-8.2.1-bin.zip \
            https://github.com/gradle/gradle-distributions/releases/download/v8.2.1/gradle-8.2.1-bin.zip \
            https://mirrors.cloud.tencent.com/gradle/gradle-8.2.1-bin.zip \
            https://repo.huaweicloud.com/gradle/gradle-8.2.1-bin.zip
          do
            echo "Trying $u"
            if curl -fL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 -o /tmp/gradle.zip "$u" && unzip -tq /tmp/gradle.zip > /dev/null; then
              echo "Downloaded OK"
              exit 0
            fi
            rm -f /tmp/gradle.zip
          done
          echo "All mirrors failed"
          exit 1
      - name: Build APK
        run: |
          cd android
          P=gradle/wrapper/gradle-wrapper.properties
          sed -i 's#^distributionUrl=.*#distributionUrl=file:///tmp/gradle.zip#' $P
          sed -i 's#validateDistributionUrl=true#validateDistributionUrl=false#' $P
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug && break
            if [ $i -eq 3 ]; then exit 1; fi
            sleep 30
          done
      - uses: actions/upload-artifact@v4
        with:
          name: istighfar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
