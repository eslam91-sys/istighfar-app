name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Add notification permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n</manifest>#' "$M"
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          P=gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' $P
          sed -i -E 's|^distributionUrl=.*gradle-([0-9.]+)-(all\|bin)\.zip|distributionUrl=https\\://github.com/gradle/gradle-distributions/releases/download/v\1/gradle-\1-bin.zip|' $P
          cat $P
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug && break
            if [ $i -eq 3 ]; then exit 1; fi
            sleep 20
          done
      - uses: actions/upload-artifact@v4
        with:
          name: istighfar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
