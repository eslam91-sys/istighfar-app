<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ورد الاستغفار</title>
<style>
:root{--bg:#f3f6f4;--surface:#ffffff;--ink:#16302b;--muted:#5d7a73;--accent:#1f7a68;--accent-ink:#ffffff;--ring:#d4e3de;--done:#c9a24a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b19;--surface:#162826;--ink:#e6f1ee;--muted:#8fb0a8;--accent:#4fc3a8;--accent-ink:#06211c;--ring:#25403b;--done:#e0bb5e}}
:root[data-theme="dark"]{--bg:#0e1b19;--surface:#162826;--ink:#e6f1ee;--muted:#8fb0a8;--accent:#4fc3a8;--accent-ink:#06211c;--ring:#25403b;--done:#e0bb5e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",Tahoma,serif;line-height:1.8;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:16px 16px 32px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:1.5rem;margin:0;font-weight:700}
.streak{color:var(--done);font-weight:600;font-size:.95rem}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.tab{border:1.5px solid var(--ring);background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 2px;font:inherit;font-size:.85rem;line-height:1.4;cursor:pointer;position:relative}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.tab .ck{position:absolute;top:2px;left:6px;font-size:.75rem;color:var(--done)}
.tab[aria-selected="true"] .ck{color:var(--accent-ink)}
.card{background:var(--surface);border-radius:22px;padding:20px 16px;text-align:center;border:1px solid var(--ring)}
.dhikr{font-size:1.25rem;font-weight:600;margin:0 0 16px;min-height:3.6em;display:flex;align-items:center;justify-content:center}
.dhikr.long{font-size:1.02rem;font-weight:400}
.tap{position:relative;width:min(72vw,280px);aspect-ratio:1;margin:0 auto;border:0;background:none;padding:0;cursor:pointer;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.tap .bg{stroke:var(--ring)}
.tap .fg{stroke:var(--accent);transition:stroke-dashoffset .2s}
.tap.done .fg{stroke:var(--done)}
.tap .face{position:absolute;inset:14%;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .08s}
.tap:active .face{transform:scale(.94)}
.num{font-size:3.4rem;font-weight:700;line-height:1.1;color:var(--ink)}
.of{color:var(--muted);font-size:.95rem}
.row{display:flex;gap:10px;justify-content:center;margin-top:18px}
.btn{border:1.5px solid var(--ring);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 16px;font:inherit;font-size:.9rem;cursor:pointer}
.msg{color:var(--done);font-weight:600;min-height:1.8em;margin-top:10px}
.week{margin-top:20px;background:var(--surface);border:1px solid var(--ring);border-radius:18px;padding:12px 14px}
.week h2{font-size:1rem;margin:0 0 8px}
.days{display:flex;justify-content:space-between}
.d{display:flex;flex-direction:column;align-items:center;font-size:.75rem;color:var(--muted);gap:4px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--ring)}
.dot.on{background:var(--done);border-color:var(--done)}
.dot.today{border-color:var(--accent)}
.tip{margin-top:16px;font-size:.88rem;color:var(--muted);text-align:center}
.rrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.rrow input{font:inherit;background:var(--bg);color:var(--ink);border:1.5px solid var(--ring);border-radius:10px;padding:4px 8px}
#rem .btn{margin-top:8px;width:100%}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header><h1>ورد الاستغفار</h1><div class="streak" id="streak"></div></header>
<div class="tabs" id="tabs" role="tablist"></div>
<section class="card">
<p class="dhikr" id="text"></p>
<button class="tap" id="tap" aria-label="عدّ">
<svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="45" fill="none" stroke-width="6"/><circle class="fg" id="fg" cx="50" cy="50" r="45" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="282.74" stroke-dashoffset="282.74"/></svg>
<span class="face"><span class="num" id="num">0</span><span class="of" id="of"></span></span>
</button>
<div class="msg" id="msg"></div>
<div class="row"><button class="btn" id="undo">تراجع</button><button class="btn" id="reset">تصفير هذا الورد</button></div>
</section>
<section class="week"><h2>آخر ٧ أيام</h2><div class="days" id="days"></div></section>
<section class="week" id="rem"><h2>التذكيرات اليومية</h2>
<div class="rrow"><label for="t-fajr">بعد الفجر</label><input type="time" id="t-fajr" value="05:30"></div>
<div class="rrow"><label for="t-asr">بعد العصر</label><input type="time" id="t-asr" value="16:30"></div>
<div class="rrow"><label for="t-sleep">قبل النوم</label><input type="time" id="t-sleep" value="22:30"></div>
<button class="btn" id="saveRem">حفظ التذكيرات</button><div class="msg" id="remMsg"></div></section>
</main>
<script>
(function(){
var SLOTS=[
{id:"fajr",name:"بعد الفجر",goal:100,text:"أستغفر الله العظيم الذي لا إله إلا هو الحي القيوم وأتوب إليه"},
{id:"asr",name:"بعد العصر",goal:100,text:"أستغفر الله وأتوب إليه"},
{id:"sleep",name:"قبل النوم",goal:1,long:1,text:"اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك علي، وأبوء بذنبي فاغفر لي، فإنه لا يغفر الذنوب إلا أنت"},
{id:"any",name:"خلال اليوم",goal:0,text:"رب اغفر لي وتب علي إنك أنت التواب الرحيم"}
];
var KEY="istighfar-v1",mem=null;
function pad(n){return n<10?"0"+n:""+n}
function dk(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
var today=dk(new Date());
function load(){var raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
var s=null;try{s=raw?JSON.parse(raw):null}catch(e){}
if(!s||typeof s!=="object")s=mem||{days:{}};
if(!s.days)s.days={};return s}
var S=load();
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function day(k){if(!S.days[k])S.days[k]={fajr:0,asr:0,sleep:0,any:0};return S.days[k]}
function slotDone(c,sl){return sl.goal>0&&c[sl.id]>=sl.goal}
function dayDone(k){var c=S.days[k];if(!c)return false;return SLOTS.every(function(sl){return sl.goal===0||slotDone(c,sl)})}
var cur="fajr",tabsEl=document.getElementById("tabs");
function slot(){return SLOTS.filter(function(s){return s.id===cur})[0]}
function ar(n){return String(n).replace(/\d/g,function(d){return "٠١٢٣٤٥٦٧٨٩"[d]})}
function buildTabs(){tabsEl.innerHTML="";SLOTS.forEach(function(sl){
var b=document.createElement("button");b.className="tab";b.setAttribute("role","tab");b.setAttribute("aria-selected",sl.id===cur);
b.textContent=sl.name;
if(slotDone(day(today),sl)){var c=document.createElement("span");c.className="ck";c.textContent="✓";b.appendChild(c)}
b.onclick=function(){cur=sl.id;msg("");render()};tabsEl.appendChild(b)})}
function msg(t){document.getElementById("msg").textContent=t}
function streak(){var n=0,d=new Date();if(!dayDone(dk(d)))d.setDate(d.getDate()-1);
while(dayDone(dk(d))){n++;d.setDate(d.getDate()-1)}return n}
function render(){
var sl=slot(),c=day(today),v=c[sl.id];
var t=document.getElementById("text");t.textContent=sl.text;t.className="dhikr"+(sl.long?" long":"");
document.getElementById("num").textContent=ar(v);
document.getElementById("of").textContent=sl.goal?("من "+ar(sl.goal)):"بلا حد";
var p=sl.goal?Math.min(v/sl.goal,1):(v?1:0);
document.getElementById("fg").style.strokeDashoffset=282.74*(1-p);
document.getElementById("tap").className="tap"+(sl.goal&&v>=sl.goal?" done":"");
var st=streak();document.getElementById("streak").textContent=st?("🔥 "+ar(st)+(st===1?" يوم":" أيام")):"";
buildTabs();
var dEl=document.getElementById("days");dEl.innerHTML="";var names=["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=dk(d);
var w=document.createElement("div");w.className="d";
var dot=document.createElement("div");dot.className="dot"+(dayDone(k)?" on":"")+(i===0?" today":"");
var l=document.createElement("span");l.textContent=names[d.getDay()];w.appendChild(dot);w.appendChild(l);dEl.appendChild(w)}}
document.getElementById("tap").onclick=function(){
var sl=slot(),c=day(today),was=slotDone(c,sl);
if(sl.goal&&c[sl.id]>=sl.goal&&sl.goal>1){msg("أتممت هذا الورد، تقبّل الله منك");return}
c[sl.id]++;save();
try{if(navigator.vibrate)navigator.vibrate(sl.goal&&c[sl.id]===sl.goal?[60,40,60]:12)}catch(e){}
if(!was&&slotDone(c,sl))msg(dayDone(today)?"أتممت ورد اليوم كاملًا، بارك الله فيك":"أتممت هذا الورد، تقبّل الله منك");
render()};
document.getElementById("undo").onclick=function(){var c=day(today),sl=slot();if(c[sl.id]>0){c[sl.id]--;save();msg("");render()}};
document.getElementById("reset").onclick=function(){var c=day(today),sl=slot();c[sl.id]=0;save();msg("");render()};
render();
})();
</script>
<script>
(function(){
var C=window.Capacitor||{};
var LN=C.Plugins&&C.Plugins.LocalNotifications;
var native=C.isNativePlatform&&C.isNativePlatform();
var RK="istighfar-rem-v1";
var ITEMS=[{id:1,k:"fajr",body:"حان وقت ورد الاستغفار بعد الفجر"},{id:2,k:"asr",body:"حان وقت ورد الاستغفار بعد العصر"},{id:3,k:"sleep",body:"سيد الاستغفار قبل النوم"}];
var saved={};try{saved=JSON.parse(localStorage.getItem(RK)||"{}")}catch(e){}
ITEMS.forEach(function(i){if(saved[i.k])document.getElementById("t-"+i.k).value=saved[i.k]});
function say(t){document.getElementById("remMsg").textContent=t}
document.getElementById("saveRem").onclick=async function(){
var times={};ITEMS.forEach(function(i){times[i.k]=document.getElementById("t-"+i.k).value||"00:00"});
try{localStorage.setItem(RK,JSON.stringify(times))}catch(e){}
if(!native||!LN){say("التذكيرات تعمل داخل تطبيق أندرويد فقط");return}
try{
var perm=await LN.requestPermissions();
if(perm.display!=="granted"){say("فعّل إذن الإشعارات للتطبيق من إعدادات الهاتف");return}
await LN.cancel({notifications:ITEMS.map(function(i){return{id:i.id}})});
await LN.schedule({notifications:ITEMS.map(function(i){var p=times[i.k].split(":");
return{id:i.id,title:"ورد الاستغفار",body:i.body,schedule:{on:{hour:parseInt(p[0],10),minute:parseInt(p[1],10)},allowWhileIdle:true}}})});
say("تم ضبط التذكيرات اليومية")
}catch(e){say("تعذّر ضبط التذكيرات")}
};
})();
</script>
</body>
</html>
